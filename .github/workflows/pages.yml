name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# Allow the GITHUB_TOKEN to publish to Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but never cancel a run that is already
# deploying — that would leave the site in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The site is plain static files at the repository root. Stage only what
      # the browser actually needs into _site/ so the artifact excludes .git,
      # .github and doc/.
      #
      # assets/reference/ is 34 MB of design source material that nothing on
      # the site links to, so it is left out. Add it back here if the pages
      # ever start referencing it.
      - name: Stage site
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js _site/
          cp -R assets/generated _site/assets/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
