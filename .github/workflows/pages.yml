name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# Allow the GITHUB_TOKEN to publish to Pages via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but never cancel a run that is already
# deploying — that would leave the site in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate source
        run: |
          npm ci
          npm run check

      - name: Save harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report-pages
          path: output/harness/latest.json
          if-no-files-found: ignore

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
