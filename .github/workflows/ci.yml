name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run harness
        run: npm run check

      - name: Save harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: output/harness/latest.json
          if-no-files-found: ignore
