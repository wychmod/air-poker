      content="数字构牌，隐藏信息，空气博弈。免费单人浏览器游戏，改编自迫稔雄《噬谎者》第 40–43 卷「空气扑克」篇。"
    />

      content="https://wychmod.github.io/air-poker/assets/share/cover-zh.png"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="assets/runtime/scene-mobile.webp"
      media="(max-width: 720px)"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="assets/runtime/scene.webp"
      media="(min-width: 721px)"
    />

    <title>空气扑克 · 下一口空气</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <canvas id="sceneCanvas" aria-hidden="true"></canvas>
      <header id="siteHeader" class="site-header"></header>
      <main id="pageContent" tabindex="-1"></main>
      <footer id="siteVisits" class="visit-counter" data-status="loading" hidden>
        <span id="visitCountLabel"></span>
        <img id="visitCountImage" height="20" alt="" referrerpolicy="no-referrer" hidden />
        <span id="visitCountStatus">
          <span data-visit-status="loading"></span>
          <span data-visit-status="local"></span>
          <span data-visit-status="unavailable"></span>
        </span>
      </footer>
    </div>
    <dialog id="rulesDialog" class="paper-dialog" aria-labelledby="rulesTitle">
      <div class="dialog-toolbar">
        <strong id="rulesTitle"></strong><span class="live-clock"></span
        ><button class="button secondary" data-action="close-rules" aria-label="关闭 / Close">
          ×
        </button>
      </div>
      <div id="rulesContent" class="dialog-body"></div>
    </dialog>
    <dialog id="recordDialog" class="review-dialog" aria-labelledby="recordTitle">
      <div class="dialog-toolbar">
        <button class="button secondary" id="closeRecord" data-action="close-record">←</button
        ><strong id="recordTitle"></strong><span class="live-clock"></span
        ><button class="button secondary" id="exportRecord" data-action="export-record"></button
        ><button
          class="button secondary"
          id="shareRecord"
          data-action="share-record"
          disabled
        ></button>
      </div>
      <div class="record-source">
        <button class="button secondary" id="currentRecord" data-action="current-record"></button
        ><button class="button secondary" id="previousRecord" data-action="previous-record"></button
        ><button class="button secondary" id="refreshRecord" data-action="refresh-record"></button>
        <p id="recordStorageStatus"></p>
      </div>
      <div id="recordContent"></div>
    </dialog>
    <dialog id="utilityDialog" class="paper-dialog utility-dialog" aria-labelledby="utilityTitle">
      <div class="dialog-toolbar">
        <strong id="utilityTitle"></strong><span class="live-clock"></span
        ><button class="button secondary" data-action="close-utility" aria-label="关闭 / Close">
          ×
        </button>
      </div>
      <div id="utilityContent" class="dialog-body"></div>
    </dialog>
    <dialog id="confirmDialog" class="paper-dialog confirm-dialog" aria-labelledby="confirmTitle">
      <div class="dialog-body">
        <h2 id="confirmTitle"></h2>
        <p id="confirmCopy"></p>
        <div class="button-row">
          <button id="confirmCancel" class="button secondary" data-action="cancel-leave"></button
          ><button id="confirmAccept" class="button primary" data-action="confirm-leave"></button>
        </div>
      </div>
    </dialog>
    <dialog id="shareDialog" class="paper-dialog share-dialog" aria-labelledby="shareTitle">
      <div class="dialog-toolbar">
        <strong id="shareTitle"></strong>
        <div class="language-switch" role="group" aria-label="Language">
          <button data-lang="zh">中</button><button data-lang="en">EN</button>
        </div>
        <button
          id="closeShare"
          class="button secondary"
          data-action="close-share"
          aria-label="关闭战报 / Close share card"
        >
          ×
        </button>
      </div>
      <div class="share-body">
        <div class="share-preview">
          <img id="sharePreview" width="1080" height="1440" alt="" hidden />
        </div>
        <div class="share-controls">
          <p id="shareIntro"></p>
          <p id="shareStatus" role="status" aria-live="polite"></p>
          <div class="button-row">
            <button
              id="saveShareImage"
              class="button primary"
              data-action="save-share"
              disabled
            ></button>
            <button
              id="nativeShareImage"
              class="button secondary"
              data-action="native-share"
              hidden
              disabled
            ></button>
          </div>
          <label id="shareLinkLabel" for="shareLink"></label>
          <input id="shareLink" type="url" readonly />
          <button id="copyShareLink" class="button secondary" data-action="copy-share"></button>
        </div>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
